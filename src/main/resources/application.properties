spring.application.name=taskmanager
# H2 Server port
# H2 Server port
server.port=8080
# H2 DB configuration
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=kr
spring.datasource.password=password
# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set JWT_SECRET in the environment when deploying; this fallback is for local development only.
jwt.secret=${JWT_SECRET:local-development-only-secret-key-change-before-deploying}
jwt.token.lifespan=3600000

# Expose Swagger UI at the path required by the project rubric.
springdoc.swagger-ui.path=/swagger-ui.html
